baseURL: https://madpin.dev/
title: Thiago MadPin's Blog
theme:
  - hugo-admonitions
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
timeZone: Europe/Dublin

languages:
  en:
    locale: en-US
    label: English
    weight: 1
    params:
      description: Thiago MadPin, software engineer, problem solver, open source enthusiast, and occasional photographer.
      slogan: From São Paulo to the world
  pt-br:
    locale: pt-BR
    label: Português
    weight: 2
    params:
      description: Thiago MadPin, engenheiro de software, solucionador de problemas, entusiasta de código aberto e fotógrafo ocasional.
      slogan: De São Paulo para o mundo

pagination:
  pagerSize: 10

permalinks:
  page:
    post: /:year/:month/:day-:slug/

outputs:
  home:
    - HTML
    - RSS

params:
  author:
    name: Thiago MadPin
    email: madpin@gmail.com
    url: https://madpin.dev/about/
  headerImage: images/hero.jpeg
  image404: img/404-bg.jpg
  avatar: img/madpin-buildings-small300.jpg
  about: Software Developer, Open Source Enthusiast and wannabe photographer
  social:
    - name: GitHub
      url: https://github.com/madpin
    - name: GitLab
      url: https://gitlab.com/madpin
    - name: LinkedIn
      url: https://www.linkedin.com/in/thiagomadpin/
    - name: Stack Overflow
      url: https://stackoverflow.com/users/1413318
    - name: Instagram
      url: https://www.instagram.com/thiagomadpin/
  bookmarks:
    - name: hckrnews
      url: https://hckrnews.com/
    - name: Indeed
      url: https://www.indeed.com/
    - name: LobeChat
      url: https://github.com/lobehub/lobe-chat/

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 3
  highlight:
    style: dracula
    noClasses: false
  goldmark:
    parser:
      # Emit a standalone image as a block-level <figure> (from the image render
      # hook) instead of wrapping it in a <p>, which produces invalid HTML.
      wrapStandAloneImageWithinParagraph: false
    renderer:
      unsafe: false

imaging:
  quality: 82
  resampleFilter: Lanczos

sitemap:
  changeFreq: weekly
  filename: sitemap.xml

taxonomies:
  category: categories
  tag: tags
