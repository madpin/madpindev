{{ define "main" }}
  {{ $posts := where site.RegularPages "Type" "post" }}
  {{ $posts = where $posts "Params.unlisted" "ne" true }}
  <div class="archive page-shell" data-pagefind-ignore="all">
    {{ range $posts.GroupByDate "2006" }}
      <section>
        <h2>{{ .Key }}</h2>
        <ol>
          {{ range .Pages }}<li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02" }}</time><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}
        </ol>
      </section>
    {{ end }}
  </div>
{{ end }}
